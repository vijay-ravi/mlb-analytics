name: prefect_mlb
prefect-version: 3.4.0

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/vijay-ravi/mlb-analytics.git
      branch: master
      access_token: null
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone-step.directory }}"
      requirements_file: requirements.txt

deployments:
  - name: MLB Analytics Deployment
    version: "1.0"
    tags:
      - mlb
      - production
    description: "Deploys the MLB analytics flow on a schedule."
    schedule:
      cron: "0 * * * *"
    flow_name: mlb_flow
    entrypoint: prefect_mlb/flows/mlb_flow.py:mlb_flow
    parameters:
      team_name: "marlins"
      start_date: "06/01/2024"
      end_date: "06/30/2024"
    work_pool:
      name: dev-pool
      work_queue_name: null
