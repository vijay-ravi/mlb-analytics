version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA_RAW') }}"
    tables:
      - name: mlb_games
        description: Raw MLB game data ingested from S3
        columns:
          - name: raw_json
            description: Raw JSON data from MLB statsapi
          - name: load_timestamp
            description: Timestamp when data was loaded
          - name: filename
            description: Original filename in S3